<mat-sidenav-container class="sidenav-container">

  <!-- SIDEBAR NAVIGATION -->
  <mat-sidenav 
    #sidenav 
    [mode]="isMobile ? 'over' : 'side'" 
    [opened]="!isMobile" 
    class="app-sidenav">
    
    <!-- 1. Fixed Top Brand Logo -->
    <div class="brand-logo">
      <div class="logo-icon">
        <mat-icon>pie_chart</mat-icon>
      </div>
      <div class="brand-name">
        <span class="title">Tasty</span>
        <span class="subtitle">Station</span>
      </div>
    </div>

    <!-- 2. Scrollable Middle Navigation Links -->
    <mat-nav-list class="nav-list">
      <a
        mat-list-item
        routerLink="/home/staff"
        routerLinkActive="active-link"
        >
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Staff</span>
     </a>

     <a
        mat-list-item
        routerLink="/home/page-management"
        >
        <mat-icon matListItemIcon>page_menu_ios</mat-icon>
        <span matListItemTitle>Page Management</span>
     </a>

      <a mat-list-item routerLink="/order-line" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Order Line</span>
      </a>
    </mat-nav-list>

    <!-- 3. Fixed Bottom Settings & Support Links -->
    <div class="bottom-nav">
      <mat-nav-list>
        <a mat-list-item routerLink="/settings">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>
        <a mat-list-item routerLink="/help">
          <mat-icon matListItemIcon>help_outline</mat-icon>
          <span matListItemTitle>Help Center</span>
        </a>
        <a mat-list-item (click)="logout()">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Logout</span>
        </a>
      </mat-nav-list>
    </div>

  </mat-sidenav>

  <!-- MAIN CONTENT AREA -->
  <mat-sidenav-content class="sidenav-content">

    <!-- HEADER / TOOLBAR -->
    <mat-toolbar class="app-header">
      
      <!-- Mobile Sidenav Hamburger Toggle Button -->
      <button mat-icon-button *ngIf="isMobile" (click)="sidenav.toggle()" aria-label="Toggle Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Spacer pushes user profile to the right -->
      <span class="spacer"></span>

      <!-- Right Header Actions -->
      <div class="header-actions">
        <!-- Notification Icon -->
        <button mat-icon-button class="notification-btn">
          <mat-icon matBadge="•" matBadgeColor="warn" matBadgeSize="small">notifications_none</mat-icon>
        </button>

        <!-- User Profile Dropdown Menu Trigger -->
        <div class="user-profile" [matMenuTriggerFor]="userMenu">
          <img src="https://i.pravatar.cc/100?img=12" alt="User Avatar" class="avatar" />
          <div class="user-details" *ngIf="!isMobile">
            <span class="user-name">Ibrahim Kadri</span>
            <span class="user-role">Admin</span>
          </div>
          <mat-icon class="dropdown-icon">expand_more</mat-icon>
        </div>

        <!-- User Dropdown Menu -->
        <mat-menu #userMenu="matMenu" xPosition="before" class="user-dropdown-menu">
          <div class="dropdown-header">
            <strong>Ibrahim Kadri</strong>
            <small>Admin</small>
          </div>
          <mat-divider></mat-divider>

          <!-- Mobile Nav Items inside User Menu on Phone Screen -->
          <ng-container *ngIf="isMobile">
            <button mat-menu-item routerLink="/dashboard">
              <mat-icon>grid_view</mat-icon>
              <span>Dashboard</span>
            </button>
            <button mat-menu-item routerLink="/order-line">
              <mat-icon>receipt_long</mat-icon>
              <span>Order Line</span>
            </button>
            <button mat-menu-item routerLink="/manage-tables">
              <mat-icon>table_restaurant</mat-icon>
              <span>Manage Table</span>
            </button>
            <button mat-menu-item routerLink="/manage-dishes">
              <mat-icon>soup_kitchen</mat-icon>
              <span>Manage Dishes</span>
            </button>
            <button mat-menu-item routerLink="/customers">
              <mat-icon>people_outline</mat-icon>
              <span>Customers</span>
            </button>
            <mat-divider></mat-divider>
          </ng-container>

          <button mat-menu-item routerLink="/profile">
            <mat-icon>person_outline</mat-icon>
            <span>My Profile</span>
          </button>
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span style="color: #ef4444;">Logout</span>
          </button>
        </mat-menu>

      </div>
    </mat-toolbar>

    <!-- ROUTER OUTLET FOR POS PAGES -->
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
