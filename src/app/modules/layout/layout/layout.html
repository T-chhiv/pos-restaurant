<mat-sidenav-container class="sidenav-container">

  <!-- Sidebar -->
  <mat-sidenav #sidenav class="app-sidenav" [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile">

    <!-- Brand -->
    <div class="brand-logo">
      <div class="logo-icon"><mat-icon>pie_chart</mat-icon></div>
      <div class="brand-name">
        <span class="title">Tasty</span>
        <span class="subtitle">Station</span>
      </div>
    </div>

    <!-- Main Navigation -->
    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/home/staff" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Staff</span>
      </a>

      <a mat-list-item routerLink="/home/page-management" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>book_2</mat-icon>
        <span matListItemTitle>Page Management</span>
      </a>
    </mat-nav-list>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <mat-nav-list>
        <a mat-list-item routerLink="/settings">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>

        <a mat-list-item routerLink="/help">
          <mat-icon matListItemIcon>help_outline</mat-icon>
          <span matListItemTitle>Help Center</span>
        </a>

        <a mat-list-item (click)="logout()">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Logout</span>
        </a>
      </mat-nav-list>
    </div>

  </mat-sidenav>


  <!-- Main Content -->
  <mat-sidenav-content class="sidenav-content">

    <!-- Header -->
    <mat-toolbar class="app-header">
      <button *ngIf="isMobile" type="button" mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle Menu">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <div class="header-actions">

        <!-- Notification -->
        <button type="button" mat-icon-button class="notification-btn">
          <mat-icon>notifications_none</mat-icon>
        </button>

        <!-- User Profile -->
        <div class="user-profile" [matMenuTriggerFor]="userMenu">
          <img src="https://i.pravatar.cc/100?img=12" alt="User Avatar" class="avatar">

          <div class="user-details" *ngIf="!isMobile">
            <span class="user-name">Ibrahim Kadri</span>
            <span class="user-role">Admin</span>
          </div>

          <mat-icon class="dropdown-icon">expand_more</mat-icon>
        </div>

        <!-- User Menu -->
        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="dropdown-header">
            <strong>Ibrahim Kadri</strong>
            <small>Admin</small>
          </div>

          <mat-divider></mat-divider>

          <!-- Mobile Navigation -->
          <ng-container *ngIf="isMobile">
            <button mat-menu-item routerLink="/dashboard">
              <mat-icon>grid_view</mat-icon>
              <span>Dashboard</span>
            </button>

            <button mat-menu-item routerLink="/order-line">
              <mat-icon>receipt_long</mat-icon>
              <span>Order Line</span>
            </button>

            <button mat-menu-item routerLink="/manage-tables">
              <mat-icon>table_restaurant</mat-icon>
              <span>Manage Table</span>
            </button>

            <button mat-menu-item routerLink="/manage-dishes">
              <mat-icon>soup_kitchen</mat-icon>
              <span>Manage Dishes</span>
            </button>

            <button mat-menu-item routerLink="/customers">
              <mat-icon>people_outline</mat-icon>
              <span>Customers</span>
            </button>

            <mat-divider></mat-divider>
          </ng-container>

          <!-- Profile -->
          <button mat-menu-item routerLink="/profile">
            <mat-icon>person_outline</mat-icon>
            <span>My Profile</span>
          </button>

          <!-- Settings -->
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>

          <mat-divider></mat-divider>

          <!-- Logout -->
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span style="color: #ef4444;">Logout</span>
          </button>
        </mat-menu>

      </div>
    </mat-toolbar>


    <!-- Scrollable Page Content -->
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
