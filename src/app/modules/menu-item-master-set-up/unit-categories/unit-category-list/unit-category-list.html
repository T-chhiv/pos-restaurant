<section class="p-3 sm:p-4 lg:p-6">

    <!-- Header -->
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

        <!-- Title -->
        <div>
            <h2 class="text-xl font-semibold text-gray-800">
                Unit Category List
            </h2>

            <p class="text-sm text-gray-500">
                Manage your restaurant Unit
            </p>
        </div>

        <!-- Search + Add -->
        <form [formGroup]="form" class="w-full sm:w-auto">
            <div class="flex w-full items-baseline gap-2">

                <!-- Search -->
                <mat-form-field
                    appearance="outline"
                    class="w-full sm:w-[280px] lg:w-[320px]"
                >
                    <mat-label>Search</mat-label>

                    <input
                        matInput
                        type="text"
                        placeholder="Search by name..."
                        formControlName="name"
                    />

                    <mat-icon matSuffix>
                        search
                    </mat-icon>
                </mat-form-field>

                <!-- Add -->
                <button
                    type="button"
                    mat-icon-button
                    class="add-button !h-14 !w-14 shrink-0 border"
                    matTooltip="Add Department"
                    (click)="openDialog()"
                >
                    <mat-icon>add</mat-icon>
                </button>

            </div>
        </form>

    </div>


    <!-- ==================== Table Card ==================== -->
    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">

        <!-- Table Wrapper -->
        <div class="min-h-[500px] overflow-x-auto">

            <table
                mat-table
                [dataSource]="dataSource"
                class="w-full min-w-[800px]"
            >

                <!-- No -->
                <ng-container matColumnDef="no">
                    <th
                        mat-header-cell
                        *matHeaderCellDef
                        class="!whitespace-nowrap"
                    >
                        No
                    </th>

                    <td
                        mat-cell
                        *matCellDef="let department; let i = index"
                    >
                        {{ i + 1 + (paginator.pageIndex * paginator.pageSize) }}
                    </td>
                </ng-container>


                <!-- Name -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>
                        Name
                    </th>

                    <td mat-cell *matCellDef="let department">
                        {{ department.name }}
                    </td>
                </ng-container>


                <!-- Description -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>
                        Description
                    </th>

                    <td mat-cell *matCellDef="let department">
                        {{ department.description }}
                    </td>
                </ng-container>


                <!-- Action -->
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef>
                        Action
                    </th>

                    <td mat-cell *matCellDef="let department">

                        <div class="flex items-center gap-1">

                            <!-- Edit -->
                            <button
                                type="button"
                                mat-icon-button
                                class="!text-blue-600"
                                matTooltip="Edit"
                                (click)="openDialog(department.id)"
                            >
                                <mat-icon>edit</mat-icon>
                            </button>

                            <!-- Delete -->
                            <button
                                type="button"
                                mat-icon-button
                                class="!text-red-600"
                                matTooltip="Delete"
                                (click)="remove(department.id)"
                            >
                                <mat-icon>delete</mat-icon>
                            </button>

                        </div>

                    </td>
                </ng-container>


                <!-- Header -->
                <tr
                    mat-header-row
                    *matHeaderRowDef="displayedColumns"
                    class="!h-14"
                ></tr>


                <!-- Rows -->
                <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns"
                    class="!h-16 transition-colors hover:bg-gray-50"
                ></tr>

            </table>

        </div>

    </div>


    <!-- Paginator -->
    <mat-paginator
        #paginator
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        showFirstLastButtons
    >
    </mat-paginator>

</section>
