<section>
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h2 class="text-xl font-semibold text-gray-800">Menu Category List</h2>
            <p class="text-sm text-gray-500">Manage your restaurant menu categories</p>
        </div>

        <form [formGroup]="form" class="w-full sm:w-auto">
            <div class="flex w-full items-baseline gap-2">
                <mat-form-field appearance="outline" class="w-full sm:w-[280px] lg:w-[320px]">
                    <mat-label>Search</mat-label>
                    <input matInput type="text" placeholder="Search by name..." formControlName="name">
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>

                <button
                    type="button"
                    mat-icon-button
                    class="add-button !h-14 !w-14 shrink-0 border"
                    matTooltip="Add Menu Category"
                    (click)="openDialog()">
                    <mat-icon>add</mat-icon>
                </button>
            </div>
        </form>
    </div>

    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
        <div class="min-h-[500px] overflow-x-auto">
            <table mat-table [dataSource]="dataSource" class="w-full min-w-[800px]">

                <ng-container matColumnDef="no">
                    <th mat-header-cell *matHeaderCellDef class="!whitespace-nowrap">No</th>
                    <td mat-cell *matCellDef="let category; let i = index">
                        {{ i + 1 + (paginator.pageIndex * paginator.pageSize) }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let category">{{ category.name }}</td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let category">{{ category.description }}</td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let category">
                        <span
                            class="rounded-full px-3 py-1 text-xs font-medium"
                            [ngClass]="category.status
                                ? 'bg-green-100 text-green-700'
                                : 'bg-red-100 text-red-700'">
                            {{ category.status ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Action</th>
                    <td mat-cell *matCellDef="let category">
                        <div class="flex items-center gap-1">
                            <button
                                type="button"
                                mat-icon-button
                                class="!text-blue-600"
                                matTooltip="Edit"
                                (click)="openDialog(category.id)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            <button
                                type="button"
                                mat-icon-button
                                class="!text-red-600"
                                matTooltip="Delete"
                                (click)="remove(category.id)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="!h-14"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns" class="!h-16 transition-colors hover:bg-gray-50"></tr>
            </table>
        </div>
    </div>

    <mat-paginator
        #paginator
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOption"
        showFirstLastButtons>
    </mat-paginator>
</section>
